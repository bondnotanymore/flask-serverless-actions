[tool.poetry]
name = "flask-serverless-actions-demo"
version = "0.1.0"
description = "Flask application built using serverless and deployed using github actions"
authors = ["Kapil Mathur <kapilmathur87@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.8"
Flask = "2.1.1"
boto3 = "1.21.32"
fleece = { version = "0.19.0", extras=["cli"] }

[tool.poetry.dev-dependencies]
pytest = "^5.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.taskipy.tasks]
fleece_set_aws_access = "fleece run -c ./environments.yml -e dev"
